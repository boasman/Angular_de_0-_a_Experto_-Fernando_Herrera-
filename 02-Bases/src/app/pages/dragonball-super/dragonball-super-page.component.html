<h1>DragonBall Page</h1>
<hr />

<section class="row">
  <div class="col-12 col-sm-6">
    <h3>Agregar:</h3>
    <app-dragonball-character-add (newCharacter)="dragonballService.addCharacter($event)"></app-dragonball-character-add>

  </div>

  <div class="col-12 col-sm-6">
    <dragonball-character-list
      [characters]="dragonballService.characters()"
      listName="Listado de personajes">
    </dragonball-character-list>

  </div>


</section>
