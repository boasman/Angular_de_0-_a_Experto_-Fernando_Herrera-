<h1 class="text-3xl font-bold font-montserrats">Todos los productos</h1>
<h2 class="text-xl mb-5">para todos los gustos</h2>

<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-6"
>
  @for (product of this.productResource.value()?.products; track product.id) {
  <product-card [title]="product.title" [description]="product.description">
  </product-card>
  }
</div>
