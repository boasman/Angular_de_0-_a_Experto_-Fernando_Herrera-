<form
  class="flex flex-col gap-2"
  [formGroup]="registerForm"
  (ngSubmit)="onSubmit()"
>

  <label class="input">
  <!-- Icono usuario -->
  <svg
    class="h-[1em] opacity-50"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
  >
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width="2"
      fill="none"
      stroke="currentColor"
    >
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M6 20v-2a6 6 0 0 1 12 0v2"></path>
    </g>
  </svg>
  <input
    type="email"
    name="email"
    class="grow"
    placeholder="Nombre Completo"
    formControlName="fullName"
  />
</label>



  <label class="input">
    <!-- Icono sobre para email -->
    <svg
      class="h-[1em] opacity-50"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
    >
      <g
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2"
        fill="none"
        stroke="currentColor"
      >
        <path d="M4 4h16v16H4z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </g>
    </svg>
    <input
      type="email"
      name="email"
      class="grow"
      placeholder="Correo Electronico"
      formControlName="email"
    />
  </label>

  <label class="input">
    <!-- Icono candado para password -->
    <svg
      class="h-[1em] opacity-50"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
    >
      <g
        stroke-linejoin="round"
        stroke-linecap="round"
        stroke-width="2"
        fill="none"
        stroke="currentColor"
      >
        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
      </g>
    </svg>
    <input
      type="password"
      name="password"
      class="grow"
      placeholder="Contraseña"
      formControlName="password"
    />
  </label>

  <button type="submit" class="btn btn-secondary">Registrar</button>


</form>

  @if(hasError()){

  <div role="alert" class="alert alert-error animate-fadeIn fixed bottom-5 right-5 w-52">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 shrink-0 stroke-current"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span>Por favor revise la información ingresada.</span>
  </div>

  }
