<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-lgs">
  Total de productoss
  <span class="text">{{productResource.value()?.count}}</span>
</h3>

<div class="divider"></div>

<!-- pagination -->

<div class="flex gap-2 items-center h-20">
  <shared-pagination
    [pages]="productResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  ></shared-pagination>

  <select #selectPerPage (change)="productPerPage.set(+selectPerPage.value)" class="select select-bordered w-32">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>

  <div class="flex flex-1">
    <button class="btn btn-primary" routerLink="/admin/product/new">
      Nuevo producto
    </button>
  </div>


</div>

<!-- listado -->

<product-table
  [products]="this.productResource.value()?.products ?? []"
></product-table>
