<div #map class="h-[calc(100vh-64px)]"></div>

<section class="fixed w-[260px] bg-white rounded top-20 left-20 p-5">
  <h2 class="text-xl font-bold text-black mb-2">Marcadores</h2>

  <div class="flex flex-col gap-2">
    <!-- <div class="form-control">
      <label class="label cursor-pointer">
        <span class="label-text">Red Pill</span>
        <input type="radio" name="radio-10" class="radio checked:bg-red-500" checked="checked">
      </label>
    </div> -->

    @for (marker of markers(); track marker.id) {

    <label class="flex items-center justify-between gap-2"
    (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
    (dblclick)="deleteMarker(marker)">
      <span class="text-black text-xs">{{ marker.mapboxMarker.getLngLat() | json }}</span>
      <input
        type="radio"
        name="radio-12"
        class="radio"
        [style]="{ backgroundColor: marker.mapboxMarker._color}"
        checked
      />
    </label>

    }
    @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded py-5">
        <p class="text-secondary text-xs">
          No hay marcadores
        </p>
      </div>
    }
  </div>
</section>
